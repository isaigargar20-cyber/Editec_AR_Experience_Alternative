<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Editec Alternative</title>
        <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
        
        <script>
            document.addEventListener("DOMContentLoaded", () => {

                const scene = document.querySelector("a-scene");

                scene.addEventListener("loaded", () => {

                    const video = document.querySelector("#video");
                    const target = document.querySelector("#target");

                target.addEventListener("targetFound", () => {
                    video.play().catch(error => {
                        console.error("Error al reproducir:", error);
                    });
                });

                target.addEventListener("targetLost", () => {
                    video.pause();
                    video.currentTime = 0;
                    });

                });

            });
        </script>
    </head>
    <body>
        <a-scene
            mindar-image="imageTargetSrc: ./mind-ar/targets.mind; filterMinCF: 0.01; filterBeta: 100"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            color-space="sRGB"
            renderer="colorManagement: false; antialias: true">

            <a-assets>
                <video id="video" src="./source/INTRO_VIDEO.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity id="target" mindar-image-target="targetIndex: 0">
                <a-video src="#video" position="0 0 0" height="0.5625" width="1" rotation="0 0 0"></a-video>
            </a-entity>
        </a-scene>
    </body>
</html>
